version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: sample-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - app-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sample-web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=appuser
      - DB_PASSWORD=SecretPassword123
      - DB_NAME=ecommerce_prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: postgres:15-alpine
    container_name: sample-db
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: SecretPassword123
      POSTGRES_DB: ecommerce_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d ecommerce_prod"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
